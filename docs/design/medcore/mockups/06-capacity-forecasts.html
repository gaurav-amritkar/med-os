<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedCore — Capacity Forecasts</title>
<link rel="stylesheet" href="../assets/medcore.css">
<style>
  .chart-card { min-height: 340px; }
  .chart-card .chart { padding: 10px 4px 0; }
</style>
</head>
<body data-active="capacity-forecasts" data-title="Capacity Forecasts">

  <div class="stack">
    <div class="grid grid-2">

      <section class="card chart-card">
        <div class="card-head">
          <div class="card-title">Bed Occupancy</div>
          <div><span class="card-sub" style="margin-right:8px;">Next:</span>
            <span class="seg"><button class="is-active">7 days</button><button>14 days</button><button>30 days</button></span>
          </div>
        </div>
        <div class="chart" id="chart-beds"></div>
      </section>

      <section class="card chart-card">
        <div class="card-head">
          <div class="card-title">ICU Demand</div>
          <div><span class="card-sub" style="margin-right:8px;">Next:</span>
            <span class="seg"><button class="is-active">7 days</button><button>14 days</button><button>30 days</button></span>
          </div>
        </div>
        <div class="chart" id="chart-icu"></div>
      </section>

      <section class="card chart-card">
        <div class="card-head">
          <div class="card-title">Oxygen &amp; Equipment</div>
          <div><span class="card-sub" style="margin-right:8px;">Next:</span>
            <span class="seg"><button class="is-active">7 days</button><button>14 days</button><button>30 days</button></span>
          </div>
        </div>
        <div class="chart" id="chart-oxygen"></div>
      </section>

      <section class="card chart-card">
        <div class="card-head">
          <div class="card-title">Staff Demand</div>
          <div><span class="card-sub" style="margin-right:8px;">Next:</span>
            <span class="seg"><button class="is-active">7 days</button><button>14 days</button><button>30 days</button></span>
          </div>
        </div>
        <div style="display:flex; justify-content:center; margin-bottom:4px;">
          <div class="legend">
            <span><i class="dot" style="background:#3b82f6;"></i>Bed</span>
            <span><i class="dot" style="background:#8b5cf6;"></i>Staff</span>
            <span><i class="dot" style="background:#ef4444;"></i>Nurses</span>
            <span><i class="dot" style="background:#f59e0b;"></i>Doctor</span>
            <span><i class="dot" style="background:#10b981;"></i>ER Care</span>
            <span><i class="dot" style="background:#06b6d4;"></i>Techs</span>
          </div>
        </div>
        <div class="chart" id="chart-staff"></div>
      </section>

    </div>
  </div>

  <script src="../assets/shell.js" defer></script>
  <script src="../assets/charts.js" defer></script>
  <script>
    window.addEventListener("load", () => {
      const labels = ["Feb 2","Feb 3","Feb 4","Feb 5","Feb 6","Feb 7","Feb 8"];
      Charts.forecastLine(document.getElementById("chart-beds"), {
        labels,
        values: [128, 142, 156, 181, 196, 213, 204],
        thresholds: { critical: 250, warning: 220, normal: 195 },
        fmt: (v) => String(Math.round(v / 25) * 25),
      });
      Charts.forecastLine(document.getElementById("chart-icu"), {
        labels,
        values: [11, 15, 19, 22, 23, 27, 27],
        thresholds: { critical: 40, warning: 35, normal: 30 },
        fmt: (v) => String(Math.round(v / 10) * 10),
      });
      Charts.declineBars(document.getElementById("chart-oxygen"), {
        id: "oxygen",
        labels,
        values: [80, 66, 48, 34, 19, 14, 6],
      });
      Charts.multiLine(document.getElementById("chart-staff"), {
        labels,
        series: [
          { name: "Bed",     color: "#3b82f6", values: [60, 56, 57, 60, 62, 66, 63] },
          { name: "Staff",   color: "#8b5cf6", values: [26, 32, 34, 44, 46, 52, 60] },
          { name: "Nurses",  color: "#ef4444", values: [20, 26, 28, 31, 40, 50, 50] },
          { name: "Doctor",  color: "#f59e0b", values: [13, 20, 25, 26, 30, 37, 40] },
          { name: "ER Care", color: "#10b981", values: [21, 24, 25, 29, 30, 25, 26] },
          { name: "Techs",   color: "#06b6d4", values: [12, 23, 35, 40, 27, 25, 31] },
        ],
      });
    });
  </script>
</body>
</html>

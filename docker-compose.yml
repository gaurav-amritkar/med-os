services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
      pull: true
    image: medos-db:local
    environment:
      POSTGRES_DB: ${DB_NAME:-medos}
      POSTGRES_USER: ${DB_USER:-medos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - medos-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [medos-private]

  migrate:
    build:
      context: .
      dockerfile: database/migrations.Dockerfile
      pull: true
    image: medos-migrations:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${DB_NAME:-medos}
      FLYWAY_USER: ${DB_USER:-medos}
      FLYWAY_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      FLYWAY_CONNECT_RETRIES: 30
      FLYWAY_SCHEMA: public
      FLYWAY_TABLE: flyway_schema_history
      # No FLYWAY_BASELINE_ON_MIGRATE, for the same reason as production: it marks
      # a version as already applied and then skips that migration, so against a
      # fresh volume it would create no tables while reporting success.
      #
      # Without an explicit command the image runs its default CMD of "-?", which
      # prints the usage text and exits 0. Compose read that as success, so the
      # backend started against an unmigrated database and migrated it itself from
      # a stale copy packaged in its own jar. The dedicated migration must run.
    command: ["migrate"]
    networks: [medos-private]
    restart: "no"

  redis:
    build:
      context: ./cache
      dockerfile: Dockerfile
      pull: true
    image: medos-redis:local
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - medos-redis-data:/data
    networks: [medos-private]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      pull: true
    image: medos-backend:local
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Platform secret for POST /api/v1/onboarding/register. Deliberately NOT
      # required (`:?`): blank disables tenant provisioning, which is the safe
      # default. Must be passed through explicitly, or the property can never be
      # set in a container and provisioning stays permanently off.
      ONBOARDING_REGISTRATION_TOKEN: ${ONBOARDING_REGISTRATION_TOKEN:-}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-medos}
      DB_USER: ${DB_USER:-medos}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY must be set in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_SUPERADMIN_USERNAME: ${BOOTSTRAP_SUPERADMIN_USERNAME:-platform}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set in .env}
    networks: [medos-private]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      pull: true
    image: medos-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-8080}:8080"
    networks: [medos-edge, medos-private]
    restart: unless-stopped

networks:
  medos-edge: {}
  medos-private:
    internal: true

volumes:
  medos-db-data:
  medos-redis-data:

# MedOS HMS — production compose override
# Usage:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Hardening vs the dev compose file:
#   - DB/Redis ports are NOT published externally (internal network only)
#   - JWT_SECRET is required — startup fails if unset
#   - CORS origins are required (no localhost defaults)
#   - Resource limits + memory-ratio JVM flags
#   - nginx/frontend is the only externally reachable service (port 80/443 via TLS terminator)

name: medos-prod

services:
  db:
    ports: !reset []

  redis:
    ports: !reset []
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

  backend:
    ports: !reset []
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (openssl rand -base64 48)}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required, comma-separated}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_PROFILES_ACTIVE: prod
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"
    restart: unless-stopped

  frontend:
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-80}:8080"
    restart: unless-stopped

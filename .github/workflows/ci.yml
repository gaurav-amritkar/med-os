name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: mvn -B test

      - name: Package backend (skip tests)
        working-directory: backend
        run: mvn -B -DskipTests package

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

  containers:
    name: Container definitions
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-database-password
      REDIS_PASSWORD: ci-redis-password
      JWT_SECRET: DKZ5wvr1Iv5kPW/7xZ2rzUUsHgr67Md4/uxGukH4zQ+uaYoHV1KMjOuX5pJHSLre
      CORS_ORIGINS: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build all container images
        run: docker compose build --pull

      - name: Apply and validate schema migrations
        run: |
          docker compose up -d db
          docker compose run --rm migrate migrate
          docker compose run --rm migrate validate

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down -v

spring:
  datasource:
    url: jdbc:h2:mem:medos-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

medos:
  security:
    jwt:
      secret: dGVzdC1vbmx5LXNlY3JldC1ub3QtdXNlZC1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OWFiY2RlZg==
      expiration-ms: 3600000
      issuer: medos-test
    pii-encryption-key: jIMpvDp7I0XTfZLdyYKeryj/7t7yKPydMu+4tOJMBus=
  ai:
    enabled: false
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.medos: DEBUG

# Disable Redis for tests (use in-memory fallback)
spring.cache.type: simple

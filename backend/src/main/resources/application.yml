spring:
  application:
    name: medos-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/medos
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  compression:
    enabled: true
  servlet:
    context-path: /

medos:
  security:
    jwt:
      # DEV-ONLY fallback. Production must supply JWT_SECRET (see application-prod.yml).
      secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LW11c3QtYmUtb3ZlcnJpZGRlbi1pbi1wcm9kLTAxMjM0NTY3ODlhYmNkZWY=}
      expiration-ms: 36000000
      issuer: medos-hms-v3
  ai:
    enabled: false
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: claude-3-5-sonnet-20241022
  bootstrap:
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    # Read from the CORS_ORIGINS env var (same key used in docker-compose / .env)
    # so edits to .env take effect in the dev/standalone profile too. Fall back to
    # localhost:5173 (Vite dev server) when unset.
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.medos: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      base-path: /manage
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

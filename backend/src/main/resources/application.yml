spring:
  application:
    name: medos-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/medos
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        session_factory:
          statement_inspector: com.medos.config.TenantStatementInspector
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    # Disabled: the dedicated migrate container is the single owner of the schema
    # (ADR-0005). It reads database/migrations directly and completes before the
    # backend starts.
    #
    # This was enabled with locations=classpath:db/migration, which depended on a
    # copy of the migrations packaged inside the jar. The application therefore
    # migrated the database itself, racing the migrate container, and doing so from
    # a copy no on-disk check could see. A stale bundled copy is how the schema
    # history ended up describing versions the repository no longer contained.
    #
    # The application still refuses to serve against a schema it does not match:
    # hibernate.ddl-auto=validate (prod) checks the mapping against the live
    # database, so an unapplied or divergent migration surfaces as a startup
    # failure rather than as a running service on the wrong schema.
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  compression:
    enabled: true
  servlet:
    context-path: /
  shutdown: graceful

medos:
  security:
    jwt:
      # No inline default on purpose. A committed fallback secret means an
      # operator who forgets this variable runs production with a signing key
      # that is public in the repository's history, and anyone can mint a token
      # for any user or tenant. Fail at startup instead.
      secret: ${JWT_SECRET}
      expiration-ms: 36000000
      issuer: medos-hms-v3
    # No inline default on purpose. A committed fallback key means an operator who
    # forgets this variable silently encrypts every patient's record with a key
    # that is public in the repository's history. Fail at startup instead.
    pii-encryption-key: ${PII_ENCRYPTION_KEY}
  ai:
    enabled: false
  onboarding:
    # Self-serve tenant registration is CLOSED by default (ADR-0003).
    # Setting this to true re-exposes POST /api/v1/onboarding/register to
    # anonymous callers, which provisions a tenant with a full admin account.
    # Only enable once the endpoint enforces email verification, captcha and
    # rate limiting — none of which exist yet.
    public-signup: false
    # Platform registration secret for POST /api/v1/onboarding/register.
    # Blank DISABLES tenant provisioning: the endpoint fails closed rather than permitting
    # it, so a deployment that forgets to set it is closed by default. Supplied from a
    # gitignored secrets file per ADR-0004; rotated by changing the file and redeploying.
    registration-token: ${ONBOARDING_REGISTRATION_TOKEN:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: claude-3-5-sonnet-20241022
    bootstrap:
      admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      superadmin-username: ${BOOTSTRAP_SUPERADMIN_USERNAME:platform}
      superadmin-password: ${BOOTSTRAP_SUPERADMIN_PASSWORD:}
  cors:
    # Read from the CORS_ORIGINS env var (same key used in docker-compose / .env)
    # so edits to .env take effect in the dev/standalone profile too. Fall back to
    # localhost:5173 (Vite dev server) when unset.
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.medos: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      base-path: /manage
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    csrf:
      enabled: false
  show-actuator: false
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

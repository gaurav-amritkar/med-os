spring:
  application:
    name: medos-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:medos}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  compression:
    enabled: true
  forward-headers-strategy: framework
  shutdown: graceful

medos:
  security:
    jwt:
      # REQUIRED in production — no fallback. Read from environment variable set by entrypoint script.
      # Generate with: openssl rand -base64 48
      secret: ${JWT_SECRET}
      expiration-ms: 36000000
      issuer: medos-hms-v3
    pii-encryption-key: ${PII_ENCRYPTION_KEY}
  ai:
    enabled: false
  bootstrap:
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}
  cors:
    allowed-origins: ${CORS_ORIGINS}

management:
  endpoints:
    web:
      base-path: /manage
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    com.medos: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
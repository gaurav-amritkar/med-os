spring:
  datasource:
    url: jdbc:h2:mem:medos;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # Standalone development uses an ephemeral H2 schema. Docker Compose
      # uses PostgreSQL plus the dedicated Flyway migration job instead.
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379

medos:
  security:
    jwt:
      # No hardcoded value here, not even a dev placeholder. A literal key in a
      # public repository is a key in a public repository. Supplied by .env,
      # which is gitignored.
      secret: ${JWT_SECRET}
      expiration-ms: 36000000
      issuer: medos-hms-v3
    pii-encryption-key: ${PII_ENCRYPTION_KEY}
  ai:
    enabled: false

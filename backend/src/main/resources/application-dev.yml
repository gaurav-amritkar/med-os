spring:
  datasource:
    url: jdbc:h2:mem:medos;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # Standalone development uses an ephemeral H2 schema. Docker Compose
      # uses PostgreSQL plus the dedicated Flyway migration job instead.
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      # H2 has no sequences by default; UHID/invoice/payment numbering uses nextval().
      # Idempotent script, shared with the prod profile.
      mode: always
      schema-locations: classpath:db/sequences.sql
  data:
    redis:
      host: localhost
      port: 6379

medos:
  security:
    jwt:
      secret: ZmFlZmFlZmFlZmFlZmFlZmFlZmFlZmFlZmFlZmFlZmFlZmFlZmFlZmFlZQ==
      expiration-ms: 36000000
      issuer: medos-hms-v3
    pii-encryption-key: __REDACTED_44__
  ai:
    enabled: false

spring:
  datasource:
    url: jdbc:h2:mem:medos;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # Standalone development uses an ephemeral H2 schema. Docker Compose
      # uses PostgreSQL plus the dedicated Flyway migration job instead.
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379

medos:
  security:
    jwt:
      secret: ZmFlZmFlZmFlZmFlZmFlZmFlZmFlZmFlZmFlZmFlZmFlZmFlZmFlZmFlZQ==
      expiration-ms: 36000000
      issuer: medos-hms-v3
    pii-encryption-key: BYGPPmPlkYrqHnzpBLYGXHsEkcB2p1xl3Gl4BUWL2jM=
  ai:
    enabled: false
